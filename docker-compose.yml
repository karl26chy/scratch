version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: stealth-scraper-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_ORIGIN=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=0
      - HEADLESS_MODE=true
      - DEFAULT_STEALTH_LEVEL=advanced
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_PROVIDER=${PROXY_PROVIDER:-webshare}
      - PROXY_LIST_URL=${PROXY_LIST_URL:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - PROXY_TEST_URL=${PROXY_TEST_URL:-https://api.ipify.org?format=json}
    ipc: host # Crucial for Chromium/Playwright to prevent shared memory crashes
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: stealth-scraper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge
