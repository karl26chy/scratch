version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: scraper-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_ORIGIN=http://localhost:3000
      - PLAYWRIGHT_BROWSERS_PATH=0
      - HEADLESS_MODE=${HEADLESS_MODE:-false}
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_PROVIDER=${PROXY_PROVIDER:-webshare}
      - PROXY_LIST_URL=${PROXY_LIST_URL:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - PROXY_TEST_URL=${PROXY_TEST_URL:-https://api.ipify.org?format=json}
      - SINGLE_TEST_MODE=${SINGLE_TEST_MODE:-false}
      - ALLOW_DIRECT_IP=${ALLOW_DIRECT_IP:-false}
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - /app/node_modules
    command: npm run dev
    ipc: host
    restart: unless-stopped
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: scraper-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - scraper-network
    restart: unless-stopped

networks:
  scraper-network:
    driver: bridge
